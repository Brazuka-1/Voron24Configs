# Pause/Resume Functionality

[pause_resume]

[display_status]

[gcode_macro Axis_calibrate]
gcode:
  G32
  G28 Z

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings[''].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E350 F{max_velocity} # fast-load
    G1 E25 F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E25 F{speed} # purge
    G1 E-420 F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    G91
    #G0 X150 Y300
    G1 Z+20 F600
    G90
    G0 X150 Y300 F6000
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    M106 S0
    #SET_FAN_SPEED FAN=Driver_Cooling SPEED=0
    #SET_FAN_SPEED FAN=Ext._Driver_Cooling SPEED=0
    #SET_LED LED="Enclosure_Lights" RED=0.3 GREEN=0.3 BLUE=0.3 SYNC=0 TRANSMIT=1
    #IDLE_LED
    #SET_FAN_SPEED FAN=AB_Cooling SPEED=0

    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=15

    SET_GCODE_OFFSET Z=0

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(230) %}      #edit to your park position
    {% set y = params.Y|default(230) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{e} F2100
    G1 Z{z_safe}
    G90
    G1 X{x} Y{y} F6000 

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    G91
    G1 E{e} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME



[gcode_macro G32]
gcode:
    #STATUS_COOLING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X150 Y150 Z30 F3600
    
[gcode_macro PRINT_END]
gcode:
    ; safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 5, th.axis_maximum.z]|min %}

    M400                           ; wait for the buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10 F1800                  ; retract filament

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 25} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    ; turn the hotend off
    M104 S0

    ; return the bed to temp, some slicers like to turn it off
    M140 S{printer["gcode_macro PRINT_START"].bedtemp|int}

    ; turn everything off in 30 min
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=1800

    ; reset speed, accel etc to configured max values
    RESETSPEEDS

    SET_SKEW CLEAR=1
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=25

    #SET_GCODE_OFFSET Z=+.1
    
