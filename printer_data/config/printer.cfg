## shimbo's voron 2.4 350 AWD cfg for brazuka heart 3
# written with love and care, pls dont messy this one up lol
# v1.2 Alpha test version post fuckery

#####################################################################
#   includes and shit
#####################################################################

[include mainsail.cfg]
[include MacroShit/*.cfg]
[include ConfigStuff/*.cfg]
[include gcode_macro.cfg]
[include chopper_tune.cfg]
[include toolhead_btt_ebbcan_G0B1_v1.2.cfg]

#####################################################################
# 	mcu setup
#####################################################################

[mcu]           # octopus pro
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_490014001351313234353230-if00

[mcu expander]  # klipper expander board
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_028011001943305254363620-if00
restart_method: command

#####################################################################
# 	probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_0553B0715154354D38202020FF0A1E0E-if00
x_offset: 0
y_offset: 18
mesh_main_direction: x
mesh_runs: 2
lift_speed: 50
accel_axes_map: x, y, z
speed: 35
home_xy_position: 150, 150
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: proximity #contact
home_method_when_homed: proximity
#home_autocalibrate: unhomed
contact_max_hotend_temperature: 300

#####################################################################
# 	printer definitions
#####################################################################

[printer]
kinematics: corexy
max_velocity:1000
max_accel: 100000
minimum_cruise_ratio: 0.50
square_corner_velocity: 25  
max_z_velocity: 50	
max_z_accel: 1000

[pause_resume]
recover_velocity: 400

[firmware_retraction]
retract_length: 0.6
retract_speed: 65 
unretract_speed: 60

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 5
accel_per_hz: 90
max_freq: 200
move_speed: 150
#hz_per_sec: 2
#sweeping_accel: 400
#sweeping_period: 0 #2

[input_shaper]
shaper_type_x: MZV
shaper_freq_x: 149.8
#damping_ratio_x: 0.033
shaper_type_y: smooth_ZV
smoother_freq_y: 101.8
#damping_ratio_y: 0.026


[gcode_arcs] 
resolution: 0.4

[exclude_object]
[skew_correction]
[respond]
[pause_resume]
[display_status]

[save_variables]
filename: ~/printer_data/config/variables.txt

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 30
show_macros_in_webui: True

#####################################################################
# 	Feed Assist
#####################################################################

# [output_pin Buffer]  # install onto heater pin to toggle on/off on the dash
# pin: PA5
# pwm: False
