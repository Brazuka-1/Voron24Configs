#####################################################################
# 	motor settings
#####################################################################

[tmc5160 stepper_x]  
run_current: 2.5
home_current: 2

driver_TBL: 0
driver_TOFF: 8
driver_HSTRT: 7
driver_HEND: 2
driver_TPFD: 2

[tmc5160 stepper_y]
run_current: 2.5
home_current: 2

driver_TBL: 0
driver_TOFF: 8
driver_HSTRT: 7
driver_HEND: 2
driver_TPFD: 2

[tmc5160 stepper_x1] 
run_current: 2.5
home_current: 0.001

driver_TBL: 0
driver_TOFF: 8
driver_HSTRT: 7
driver_HEND: 2
driver_TPFD: 2

[tmc5160 stepper_y1]
run_current: 2.5
home_current: 0.001

driver_TBL: 0
driver_TOFF: 8
driver_HSTRT: 7
driver_HEND: 2
driver_TPFD: 2

[stepper_x]
microsteps: 32
[stepper_y]
microsteps: 32
[stepper_x1]
microsteps: 32
[stepper_y1]
microsteps: 32

#####################################################################
# 	danger klipper      https://docs.kalico.gg/Bleeding_Edge.html
#####################################################################

[force_move]
enable_force_move: True

[pa_test]

[danger_options]
homing_start_delay: 0.001
endstop_sample_count: 1
#minimal_logging: False
log_shutdown_info: True
log_config_file_at_startup: False
log_statistics: False

[stepper_x]
high_precision_step_compress: true
[stepper_x1]
high_precision_step_compress: true
[stepper_y]
high_precision_step_compress: true
[stepper_y1]
high_precision_step_compress: true

# [input_shaper]
# enabled_extruders: extruder

[extruder]
#control: mpc
heater_power: 100
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 

#####################################################################
# 	Safety Shit
#####################################################################

[verify_heater extruder]
max_error: 120
check_gain_time: 60 # uncomment for mpc test 
hysteresis: 30 # uncomment for mpc test

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10
max_error: 10

[idle_timeout]
timeout: 1800    

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

#[autotune_tmc stepper_x]
#motor: ldo-42sth48-2504ah
#voltage: 48
#tuning_goal: performance

#[autotune_tmc stepper_x1]
#motor: ldo-42sth48-2504ah
#voltage: 48
#tuning_goal: performance

#[autotune_tmc stepper_y]
#motor: ldo-42sth48-2504ah
#voltage: 48
#tuning_goal: performance

#[autotune_tmc stepper_y1]
#motor: ldo-42sth48-2504ah
#voltage: 48
#tuning_goal: performance

[stepper_x]
step_pin: PF9             
dir_pin: PF10              
enable_pin: !PG2        
rotation_distance: 40      
full_steps_per_rotation:200   
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0            
position_endstop: 300  
position_max: 300  
homing_speed: 150          
homing_retract_dist: 2     
homing_positive_dir: true  
use_sensorless_homing: true

[tmc5160 stepper_x]
cs_pin: PF2
spi_bus:spi1
sense_resistor: 0.022
diag1_pin: ^!PG12 
driver_SGT: 2
interpolate: false

#################################

[stepper_x1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
full_steps_per_rotation:200

[tmc5160 stepper_x1]
cs_pin: PE1
spi_bus:spi1
sense_resistor: 0.022
interpolate: false

#################################

[stepper_y]
step_pin: PC13              
dir_pin: PF0              
enable_pin: !PF1          
rotation_distance: 40      
full_steps_per_rotation:200   
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: 0            
position_endstop: 300     
position_max: 300        
homing_speed: 150           
homing_retract_dist: 2     
homing_positive_dir: true  
use_sensorless_homing: true

[tmc5160 stepper_y]
cs_pin: PE4
spi_bus:spi1
sense_resistor: 0.022
interpolate: false
diag1_pin: ^!PG13
driver_SGT: 2
interpolate: false

#################################

[stepper_y1]
step_pin: PE6             
dir_pin: PA14              
enable_pin: !PE0                
rotation_distance: 40      
full_steps_per_rotation:200   

[tmc5160 stepper_y1]
spi_bus:spi1
cs_pin: PD3
sense_resistor: 0.022
interpolate: false

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5
homing_speed: 10
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC4
interpolate: false
run_current: 1.5
hold_current: 1.5
sense_resistor: 0.0110

#################################

[stepper_z1]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD11
interpolate: false
run_current: 1.5
hold_current: 1.5
sense_resistor: 0.0110

#################################

[stepper_z2]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PC6
interpolate: false
run_current: 1.5
hold_current: 1.5
sense_resistor: 0.0110

#################################

[stepper_z3]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PC7
interpolate: false
run_current: 1.5
hold_current: 1.5
sense_resistor: 0.0110

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: can0:EXT_STEP                     
dir_pin: can0:EXT_DIR                       
enable_pin: !can0:EXT_EN 

microsteps: 32                      
rotation_distance: 55
full_steps_per_rotation: 200
gear_ratio: 37:1
pwm_cycle_time: 0.01

heater_pin: PA0  
sensor_type: PT1000
sensor_pin: can0:TH0  
max_power: 1
min_temp: 0                      
max_temp: 400

min_extrude_temp: 0              
filament_density: 1.20
filament_heat_capacity: 1.8

heater_power: 100
cooling_fan: fan                  
max_extrude_cross_section: 5
max_extrude_only_distance: 1250.0
nozzle_diameter: 0.4         
filament_diameter: 1.75     

pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 500
max_extrude_only_velocity: 100
max_extrude_only_accel: 1000
instantaneous_corner_velocity: 1



#block_heat_capacity: 26.1100
#sensor_responsiveness: 0.115066
#ambient_transfer: 0.0708064
#fan_ambient_transfer: 0.0708064, 0.147823, 0.179016, 0.19074, 0.206899, 0.22524, 0.21861

[tmc2209 extruder]
uart_pin: can0:EXT_UART
stealthchop_threshold: 0
run_current: 0.8
sense_resistor: 0.110

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: expander:PA1
sensor_type: Generic 3950          
sensor_pin: expander:PA5                  
max_power: 0.6                     
min_temp: -70                       
max_temp: 125
                       
control: pid
pid_kp: 39.452
pid_ki: 1.263
pid_kd: 308.157

#####################################################################
# 	Thermister Settings
#####################################################################

[static_digital_output _disable_max31865]     # _ before name hides it in pins on dash
pins: !PF8

[thermistor generic_10k_3950]
temperature1: 25
resistance1: 10000
beta: 3950

[temperature_sensor Front_motors]
sensor_type: generic_10k_3950
sensor_pin: PF5

[temperature_sensor Back_motors]
sensor_type: generic_10k_3950
sensor_pin: PF3

[temperature_sensor Extruder_motor]
sensor_type: Generic 3950
sensor_pin: PF6

#####################################################################
# 	LED Control
#####################################################################

[neopixel Enclosure_Lights]
pin: PB10
chain_count: 18
color_order: GRB
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

[static_digital_output onboardLED]
pins: !expander:PA4

[neopixel expanderPixel]
pin: expander:PB1
chain_count: 1
initial_RED: 0.35
initial_GREEN: 0.0
initial_BLUE: 0.0

#####################################################################
# 	Fan Control
#####################################################################

[heater_fan hotend_fan]
pin: can0:FAN1
max_power: 1
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1


[fan]
pin: can0:RGBLED
cycle_time: 0.0001
min_power: 0.15   # anything below 15% is off
max_power: 0.90
kick_start_time: 0.100

[temperature_fan Klipper_server]
sensor_type: temperature_host                                    # This is what the Pi4's Temperature sensor is known as.
pin: PD15                                                        # Set this to your fan pin
max_temp: 85                                                     # Set below 85C, Pi4+ MCU can be damaged at 85C
target_temp: 70                                                  # Set this to your preferred running temperature
min_temp: 0
shutdown_speed: 0.0
kick_start_time: 0.2
max_speed: 0.8
min_speed: 0.6
max_power: 1
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 0.5

[temperature_fan Octopus_Pro]
sensor_type: temperature_mcu                                   
pin: PE5                                                    
max_temp: 85                                                     
target_temp: 65                                                  
min_temp: 0
shutdown_speed: 0.0
kick_start_time: 0.2
max_speed: 0.6
min_speed: 0.1
max_power: 1
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 0.5

[fan_generic AC_Eletronics]
pin: PD14
kick_start_time: 0.25
cycle_time: 0.15
max_power: 1

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[quad_gantry_level]
gantry_corners:
	-60,-10
	354,364
points:
   50,25
   50,225
   250,225
   250,25
   
speed: 500                        
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 500
horizontal_move_z: 2
mesh_min: 50,50
mesh_max: 275, 275
probe_count: 25,25
fade_start: 0.5
fade_end: 2
algorithm: bicubic
zero_reference_position: 150, 150
split_delta_z: 0.025
move_check_distance: 5.0
mesh_pps: 2, 2
bicubic_tension: 0.1            

[motors_sync]
axes: x,y
#    Axes on which calibration will be performed.
accel_chip: beacon
#    Accelerometer for vibrations collection: adxl345 / mpu9250 etc.
chip_filter: median
#    Filter type for data from the accelerometer: 'median' works well in
#    most cases, but some particularly noisy printers (fans, etc.) may
#    require a more powerful filter - 'kalman'. On lis2dw filters disabled.
#median_size: 3
#    Median filter window size.
#kalman_coeffs: 1.1, 1., 1e-1, 1e-2, .5, 1.
#    Simple coefficients describing the kalman filter.
microsteps: 32
#    Maximum microstepping displacement of the stepper motor rotor.
#steps_model: linear, 20000, 0
#    Mathematical model and its coefficients representing the dependence
#    of stepper motor microstep displacement on the measured magnitude.
#max_step_size: 3
#    The maximum number of microsteps that the motor can take move at time,
#    to achieve the planned magnitude.
#axes_steps_diff: 4
#    The difference in motor positions in microsteps between two axes, used
#    to trigger a check for magnitude shift on the secondary axis in corexy
#    like kinematics. Default value: max_step_size + 1.
retry_tolerance: 2000
#    The forced threshold to which a pair of stepper motors on one belt
#    will have to lower the magnitude of the oscillations. It's recommended
#    to configure in order to filter possible inaccuracies. After several
#    iterations of starting synchronization, you will find the edge, to
#    which this parameter should be omitted.
retries: 10
#    The maximum number of repetitions to achieve the forced threshold of
#    oscillations.
head_fan: heater_fan hotend_fan
#    Toolhead fan, which will be turned off during sync to eliminate noise.


[auto_speed]
results_dir: ~/printer_data/config ; Destination directory for graphs
#axis: diag_x, diag_y     # One or multiple of `x`, `y`, `diag_x`, `diag_y`, `z`
margin: 20               # How far away from your axes to perform movements
#settling_home: 1         # Perform settling home before starting Auto Speed
max_missed: 2            # Maximum full steps that can be missed
endstop_samples: 3       # How many endstop samples to take for endstop variance
accel_min: 50000         # Minimum acceleration test may try
accel_max: 150000.0      # Maximum acceleration test may try
accel_accu: 0.05         # Keep binary searching until the result is within this percentage
velocity_min: 500        # Minimum velocity test may try
velocity_max: 2000       # Maximum velocity test may try
velocity_accu: 0.05      # Keep binary searching until the result is within this percentage
#derate: 0.8              # Derate discovered results by this amount
#validate_margin: Unset   # Margin for VALIDATE, Defaults to margin#validate_inner_margin: 20.0 ; Margin for VALIDATE inner pattern
#validate_iterations: 50  # Perform VALIDATE pattern this many times



